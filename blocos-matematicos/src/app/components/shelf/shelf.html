<div class="shelf" [class.operation-layout]="operationLayout" [class.build-layout]="buildLayout" [class.subtraction-layout]="subtractionLayout">
  @for (column of columns; track column.label) {
    <div class="col"
      [class.compact]="column.count > 8 || (column.kind === 'thousand' && column.count > 4)"
      [class.thousand-column]="column.kind === 'thousand'"
      [class.square-column]="column.kind === 'hundred'"
      [class.bar-column]="column.kind === 'ten'">
      <div class="col-label">{{ column.label }}</div>
      <div class="col-blocks">
        @for (_ of blocks(column.count); track $index) {
          @if (column.kind === 'thousand') {
            <span class="cube-scene" [class.removable]="interactive" aria-label="Cubo de milhar" (click)="remove(column.kind)">
              <span class="cube-3d">
                <span class="cube-face cube-front"></span>
                <span class="cube-face cube-back"></span>
                <span class="cube-face cube-right"></span>
                <span class="cube-face cube-left"></span>
                <span class="cube-face cube-top"></span>
                <span class="cube-face cube-bottom"></span>
              </span>
            </span>
          } @else {
            <span class="block"
              [class.removable]="interactive"
              (click)="remove(column.kind)"
              [class.bar]="column.kind === 'ten'"
              [class.carry-bar]="column.kind === 'ten' && column.carry && $index >= column.count - column.carry"
              [class.plate]="column.kind === 'hundred'"
              [class.carry-plate]="column.kind === 'hundred' && column.carry && $index >= column.count - column.carry"></span>
          }
        }
      </div>
      <div class="col-count">{{ column.count }}</div>
    </div>
  }
</div>
