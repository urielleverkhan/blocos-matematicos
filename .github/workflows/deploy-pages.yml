name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: blocos-matematicos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blocos-matematicos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static application
        run: >
          npx ng build
          --configuration production
          --output-mode static
          --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare SPA fallback
        run: cp dist/blocos-matematicos/browser/index.html dist/blocos-matematicos/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blocos-matematicos/dist/blocos-matematicos/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
